<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Patient Portal | Endocrinology & Diabetes Care Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
    <!-- Tailwind CSS Configuration (Added for styling consistency with user/front-end pages, though custom CSS handles layout) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0284c7', // Medical Blue
                        secondary: '#0369a1',
                        accent: '#38bdf8',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        body.dark-mode .stat-card,
        body.dark-mode .chart-card,
        body.dark-mode .data-table,
        body.dark-mode .settings-form,
        body.dark-mode .product-card {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark-mode .stat-value,
        body.dark-mode .card-header h3,
        body.dark-mode .page-title h1,
        body.dark-mode .product-title,
        body.dark-mode .form-group label {
            color: #f1f5f9;
        }

        body.dark-mode .stat-label,
        body.dark-mode .page-title p,
        body.dark-mode .product-stock,
        body.dark-mode .activity-time {
            color: #94a3b8;
        }

        body.dark-mode .stat-icon {
            background: rgba(2, 132, 199, 0.2);
        }

        body.dark-mode th,
        body.dark-mode td {
            color: #e2e8f0;
            border-bottom-color: #334155;
        }

        body.dark-mode .search-bar {
            background: #334155;
            border-color: #475569;
        }

        body.dark-mode .search-bar input {
            background: transparent;
            color: #f1f5f9;
        }

        body.dark-mode .action-btn {
            background: #334155;
            border-color: #475569;
            color: #38bdf8;
        }

        body.dark-mode .action-btn:hover {
            background: #0284c7;
            color: white;
        }

        body.dark-mode .status-completed {
            background: #166534;
            color: #86efac;
        }

        body.dark-mode .status-pending {
            background: #854d0e;
            color: #fde047;
        }

        body.dark-mode .status-processing {
            background: #1e40af;
            color: #93c5fd;
        }

        body.dark-mode .activity-icon {
            background: rgba(2, 132, 199, 0.2);
        }

        body.dark-mode .form-group input,
        body.dark-mode .form-group select {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }
        
        body.dark-mode .top-header {
            background-color: #0f172a; 
            border-bottom: 1px solid #334155;
        }

        /* Sidebar */
        .sidebar {
            width: 315px;
            background-color: #ffffff;
            color: #1e293b;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            transform: translateX(0);
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.05);
            border-right: 1px solid #eef2ff;
        }

        body.dark-mode .sidebar {
            background: #1e293b;
            color: #f1f5f9;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 1001;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.active {
            display: block;
        }

        body.sidebar-open {
            overflow: hidden;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid #eef2ff;
        }

        body.dark-mode .sidebar-header {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* EXACT Logo Sizing (w-12 h-12) from Template (preserved styling structure but updated colors/icons) */
        .logo-icon {
            width: 48px;
            height: 48px;
            background: #0284c7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.5;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            text-decoration: none;
            letter-spacing: -0.025em;
            font-family: 'Playfair Display', serif;
        }

        body.dark-mode .logo-text {
            color: #ffffff;
        }

        .logo-text span {
            color: #0284c7;
        }

        .nav-menu {
            padding: 1.5rem 0;
        }

        .nav-item {
            list-style: none;
            margin-bottom: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1.5rem;
            color: #475569;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
            cursor: pointer;
            border-radius: 0 12px 12px 0;
        }

        body.rtl-active .nav-link {
            border-radius: 12px 0 0 12px;
        }

        .nav-link:hover {
            background: rgba(2, 132, 199, 0.08);
            color: #0284c7;
        }

        .nav-link.active {
            background: #0284c7;
            color: white;
        }

        .nav-link i {
            width: 24px;
            font-size: 1.2rem;
        }

        .sidebar-action-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.75rem 1.5rem;
            margin: 1rem 0 1.5rem 0;
            color: #475569;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            cursor: pointer;
            border-top: 1px solid #eef2ff;
        }

        body.dark-mode .sidebar-action-btn {
            border-top-color: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        .sidebar-action-btn:hover {
            background: rgba(220, 38, 38, 0.08);
            color: #dc2626;
        }

        body.dark-mode .sidebar-action-btn:hover {
            color: #f87171;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 315px;
            padding: 0 2rem 2rem 2rem; 
            transition: margin-left 0.3s ease;
            min-height: 100vh;
            min-width: 0;
            max-width: 100vw;
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 0 1rem 1rem 1rem;
            }
        }

        /* RTL Support */
        body.rtl-active {
            direction: rtl;
        }

        body.rtl-active .sidebar {
            left: auto;
            right: 0;
            border-right: none;
            border-left: 1px solid #eef2ff;
        }

        body.dark-mode.rtl-active .sidebar {
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        body.rtl-active .main-content {
            margin-left: 0;
            margin-right: 315px;
        }

        @media (max-width: 768px) {
            body.rtl-active .main-content {
                margin-right: 0;
            }

            body.rtl-active .sidebar {
                transform: translateX(100%);
            }

            body.rtl-active .sidebar.mobile-open {
                transform: translateX(0);
            }

            body.rtl-active .menu-toggle {
                left: auto;
                right: 1rem;
            }
        }

        /* Mobile Menu Toggle Button */
        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1100;
            background: #0284c7;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }

        .menu-toggle:hover {
            transform: scale(1.05);
            background: #0369a1;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        /* Page Container */
        .page-container {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .page-container.active-page {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top Header - Now Sticky */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            background-color: #f8fafc; 
            z-index: 900;
            padding: 1.5rem 0;
            border-bottom: 1px solid #eef2ff;
        }
        
        @media (max-width: 768px) {
            .top-header {
                padding-top: 70px; 
            }
        }

        @media (max-width: 768px) {
            .top-header {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
        }

        .page-title h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e293b;
        }

        body.dark-mode .page-title h1 {
            color: #f1f5f9;
        }

        @media (max-width: 480px) {
            .page-title h1 {
                font-size: 1.5rem;
            }
        }

        .page-title p {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .header-actions {
                width: 100%;
                flex-direction: column;
                gap: 0.8rem;
            }
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.5rem 1rem;
            gap: 0.5rem;
            flex: 1;
            min-width: 180px;
        }

        @media (max-width: 768px) {
            .search-bar {
                width: 100%;
            }

            .search-bar input {
                width: 100%;
            }
        }

        .search-bar input {
            border: none;
            outline: none;
            font-size: 0.9rem;
            width: 200px;
            background: transparent;
        }

        .toggle-buttons {
            display: flex;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .toggle-buttons {
                justify-content: center;
            }
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #0284c7;
            background: transparent;
            color: #0284c7;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .text-btn {
            font-size: 14px;
            font-weight: 600;
            width: auto;
            border-radius: 40px;
            padding: 0 16px;
        }

        .icon-btn:hover {
            background: #0284c7;
            color: #fff;
        }

        body.dark-mode .icon-btn {
            border-color: #38bdf8;
            color: #38bdf8;
        }

        body.dark-mode .icon-btn:hover {
            background: #38bdf8;
            color: #1e293b;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 1.2rem;
            transition: transform 0.2s;
            border: 1px solid #eef2ff;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
        }

        .stat-icon i {
            font-size: 1.4rem;
            color: #0284c7;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) and (min-width: 769px) {
            .charts-section {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid #eef2ff;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
        }

        /* Progress Items */
        .top-product-item {
            margin-bottom: 1rem;
            width: 100%;
        }

        .top-product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .top-product-name {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .top-product-sales {
            font-weight: 600;
            font-size: 0.85rem;
            color: #0284c7;
        }

        .progress-bar-container {
            background: #e2e8f0;
            border-radius: 10px;
            height: 6px;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: #0284c7;
            height: 100%;
            border-radius: 10px;
        }

        /* Tables */
        .data-table {
            background: white;
            border-radius: 20px;
            padding: 1.2rem;
            border: 1px solid #eef2ff;
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        @media (max-width: 640px) {
            table {
                min-width: 100%;
            }

            th,
            td {
                padding: 0.6rem;
                font-size: 0.75rem;
            }
        }

        th,
        td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid #eef2ff;
        }

        th {
            font-weight: 600;
            color: #475569;
            font-size: 0.8rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-processing {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Cards Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 640px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eef2ff;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-weight: 700;
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }

        .product-price {
            color: #0284c7;
            font-weight: 600;
        }

        .product-stock {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 0.5rem;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        @media (max-width: 640px) {
            .quick-actions {
                flex-direction: column;
                gap: 0.8rem;
            }
        }

        .action-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-weight: 600;
            color: #0284c7;
            transition: all 0.2s;
            cursor: pointer;
        }

        .action-btn:hover {
            background: #0284c7;
            color: white;
            border-color: #0284c7;
        }

        /* Activity Items */
        .activity-item {
            display: flex;
            gap: 1rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        body.dark-mode .activity-item {
            border-bottom-color: #334155;
        }

        .activity-icon {
            width: 36px;
            height: 36px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-icon i {
            color: #0284c7;
        }

        .activity-content p {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .activity-time {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        /* Settings Form */
        .settings-form {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid #eef2ff;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
        }

        .save-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .save-btn {
                width: 100%;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #0284c7;
            border-radius: 3px;
        }

        /* Mobile 360px fixes */
        @media (max-width: 480px) {
            .sidebar-header {
                padding-top: 4.5rem;
            }
        }
    
        body.dark-mode .nav-link {
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <!-- Clinic Logo -->
                <a href="index.html" class="flex items-center gap-2 text-decoration-none" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-heartbeat text-3xl text-primary" style="color: #0284c7; font-size: 1.875rem;"></i>
                    <span class="font-serif text-2xl font-bold text-primary" style="font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: #0284c7; letter-spacing: -0.025em;">EndoClinic</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item" data-page="dashboard"><a class="nav-link active"><i
                            class="fas fa-house"></i><span>Home Overview</span></a></li>
                <li class="nav-item" data-page="metrics"><a class="nav-link"><i
                            class="fas fa-chart-bar"></i><span>My Metrics</span></a></li>
                <li class="nav-item" data-page="appointments"><a class="nav-link"><i
                            class="fas fa-calendar-check"></i><span>Appointments</span></a></li>
                <li class="nav-item" data-page="prescriptions"><a class="nav-link"><i
                            class="fas fa-pills"></i><span>Prescriptions</span></a></li>
                <li class="nav-item" data-page="settings"><a class="nav-link"><i
                            class="fas fa-user-cog"></i><span>Account Settings</span></a></li>
            </ul>
            <!-- Sidebar Theme & RTL Controls -->
            <div class="sidebar-footer-controls" style="padding: 0 1.5rem; margin-top: auto; margin-bottom: 0.75rem; display: flex; gap: 8px;">
                <button class="icon-btn theme-toggle-btn" id="sidebarDarkModeBtn" title="Toggle Theme" aria-label="Toggle Theme" style="flex: 1; border-radius: 12px; height: 38px;">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="icon-btn text-btn rtl-toggle-btn" id="sidebarRtlBtn" title="Toggle RTL" style="flex: 1; border-radius: 12px; height: 38px;">

            </div>
            <a href="login.html" class="sidebar-action-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </aside>

        <main class="main-content" id="mainContent">
            <div id="dashboard-page" class="page-container active-page"></div>
            <div id="metrics-page" class="page-container"></div>
            <div id="appointments-page" class="page-container"></div>
            <div id="prescriptions-page" class="page-container"></div>
            <div id="settings-page" class="page-container"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // ---------- DATA adapted for Endocrinology Clinic User Dashboard ----------
        const paymentHistory = [

            { id: '#APT-845', type: 'Initial Consultation', date: '2026-07-10', status: 'Completed', amount: '$250.00' }
        ];

        const upcomingClasses = [
            { id: '#APT-922', type: 'Dietitian Session', date: 'Next Thursday at 10:00 AM', status: 'Upcoming', tech: 'Dr. Elena Patel' }
        ];

        const myEnrolledClasses = [
            { id: 1, name: 'Fasting Blood Glucose', serial: 'Target: 80-130 mg/dL', installDate: 'Last logged: 95 mg/dL', status: 'In Range', nextService: 'Next log: Tomorrow AM' },
            { id: 2, name: 'HbA1c Level', serial: 'Target: < 7.0%', installDate: 'Last tested: 6.8%', status: 'In Range', nextService: 'Next test: Dec 15, 2026' }
        ];

        const studentSkills = [
            { name: 'Medication Adherence', remaining: 98, percent: 98 },
            { name: 'Diet Plan Compliance', remaining: 85, percent: 85 },
            { name: 'Daily Step Goal', remaining: 75, percent: 75 }
        ];

        const activitiesFeed = [
            { icon: 'calendar-check', text: 'Dietitian Session confirmed for Next Thursday', time: '2 hours ago' },
            { icon: 'pills', text: 'Levothyroxine prescription refilled', time: '3 days ago' },
            { icon: 'vial', text: 'Lab results (Thyroid Panel) uploaded to portal', time: '1 week ago' }
        ];

        // Theme & RTL Toggle Functions
        function updateThemeUI() {
            const isDark = document.body.classList.contains('dark-mode') || document.documentElement.classList.contains('dark');
            const darkBtns = document.querySelectorAll('#darkModeIconBtn, #sidebarDarkModeBtn, .theme-toggle-btn');
            darkBtns.forEach(btn => {
                btn.innerHTML = isDark ? '<i class="fas fa-sun text-yellow-400"></i>' : '<i class="fas fa-moon"></i>';
                btn.setAttribute('title', isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode');
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            document.documentElement.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            localStorage.setItem('endoClinic_darkMode', isDark);
            updateThemeUI();
        }

        function updateRtlUI() {
            const isRtl = document.body.classList.contains('rtl-active') || document.documentElement.dir === 'rtl';
            const rtlBtns = document.querySelectorAll('#rtlIconBtn, #sidebarRtlBtn, .rtl-toggle-btn');
            rtlBtns.forEach(btn => {
                btn.innerText = isRtl ? 'RTL' : 'LTR';
                btn.setAttribute('title', isRtl ? 'Switch to Left-to-Right' : 'Switch to Right-to-Left');
            });
        }

        function toggleRTL() {
            document.body.classList.toggle('rtl-active');
            const isRtl = document.body.classList.contains('rtl-active');
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            localStorage.setItem('direction', isRtl ? 'rtl' : 'ltr');
            localStorage.setItem('endoClinic_rtl', isRtl);
            updateRtlUI();
        }

        function closeSidebar() {
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
            document.body.classList.remove('sidebar-open');
        }

        function openSidebar() {
            sidebar.classList.add('mobile-open');
            overlay.classList.add('active');
            document.body.classList.add('sidebar-open');
        }

        window.showPage = function (pageId) {
            const pages = ['dashboard', 'metrics', 'appointments', 'prescriptions', 'settings'];
            pages.forEach(p => document.getElementById(`${p}-page`).classList.remove('active-page'));
            document.getElementById(`${pageId}-page`).classList.add('active-page');
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.querySelector(`[data-page="${pageId}"] .nav-link`).classList.add('active');
            if (window.innerWidth <= 768) closeSidebar();
        };

        // Render Functions
        function renderDashboard() {
            const dashboardDiv = document.getElementById('dashboard-page');
            dashboardDiv.innerHTML = `
        <div class="top-header">
          <div class="page-title"><h1>Welcome Back, Emma!</h1><p>Here is your personal health dashboard</p></div>
          <div class="header-actions">
            <div class="toggle-buttons">
              <button class="icon-btn theme-toggle-btn" id="darkModeIconBtn" title="Toggle Theme" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
              <button class="icon-btn text-btn" id="rtlIconBtn">LTR</button>
            </div>
            <div class="user-profile"><div class="user-avatar">E</div></div>
          </div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-heartbeat"></i></div><div class="stat-value" style="font-size:1.4rem;">95 mg/dL</div><div class="stat-label">Last Glucose Log</div></div>
          <div class="stat-card"><div class="stat-icon" style="background:rgba(22, 101, 52, 0.1);"><i class="fas fa-check-circle" style="color:#166534;"></i></div><div class="stat-value" style="font-size:1.4rem;">6.8%</div><div class="stat-label">Latest HbA1c</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-value" style="font-size:1.4rem;">Next Thu</div><div class="stat-label">Upcoming Visit</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-bell"></i></div><div class="stat-value">2</div><div class="stat-label">New Messages</div></div>
        </div>
        
        <div class="quick-actions">
          <button class="action-btn" onclick="alert('Log Metric modal opened')"><i class="fas fa-plus"></i> Log Blood Sugar</button>
          <button class="action-btn" onclick="showPage('appointments')"><i class="fas fa-calendar-plus"></i> Book Appointment</button>
          <button class="action-btn"><i class="fas fa-pills"></i> Request Refill</button>
        </div>
        
        <div class="charts-section">
          <!-- Skill Progress Card -->
          <div class="chart-card">
            <div class="card-header"><h3>Health Goals Progress</h3><span style="color:#0284c7; font-size:0.8rem;">Monthly Summary</span></div>
            <div id="filterStatusList"></div>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 1rem;"><i class="fas fa-info-circle"></i> Great job staying consistent with your medication!</p>
          </div>
          
          <!-- Upcoming Class Card -->
          <div class="chart-card">
            <div class="card-header"><h3>Upcoming Appointment</h3></div>
            ${upcomingClasses.map(r => `
              <div style="border: 1px solid #eef2ff; padding: 1rem; border-radius: 12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem;">
                  <strong>${r.type}</strong> <span class="status-badge status-processing">${r.status}</span>
                </div>
                <p style="font-size:0.85rem; color:#64748b; margin-bottom: 0.2rem;"><i class="fas fa-clock mr-1"></i> ${r.date}</p>
                <p style="font-size:0.85rem; color:#64748b;"><i class="fas fa-user-md mr-1"></i> ${r.tech}</p>
              </div>
            `).join('')}
            
            <h3 style="font-size: 1rem; font-weight: 600; color: #1e293b; margin-top: 1.5rem; margin-bottom: 1rem;">Recent Activity</h3>
            ${activitiesFeed.map(a => `
              <div class="activity-item">
                <div class="activity-icon"><i class="fas fa-${a.icon}"></i></div>
                <div class="activity-content">
                  <p>${a.text}</p>
                  <span class="activity-time">${a.time}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="data-table">
          <div class="card-header"><h3>Recent Visits</h3><a href="#" style="color:#0284c7; font-size:0.8rem;" onclick="showPage('appointments'); return false;">View All &rarr;</a></div>
          <div id="recentOrdersTable"></div>
        </div>
      `;

            document.getElementById('filterStatusList').innerHTML = studentSkills.map(p => `
        <div class="top-product-item">
          <div class="top-product-header">
            <span class="top-product-name">${p.name}</span>
            <span class="top-product-sales" style="color: ${p.percent < 50 ? '#dc2626' : '#0284c7'}">${p.remaining}%</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${p.percent}%; background-color: ${p.percent < 50 ? '#dc2626' : '#0284c7'};"></div>
          </div>
        </div>
      `).join('');

            document.getElementById('recentOrdersTable').innerHTML = `<table><thead><tr><th>Appt ID</th><th>Visit Type</th><th>Date</th><th>Status</th></tr></thead><tbody>${paymentHistory.slice(0, 3).map(o => `<tr><td>${o.id}</td><td>${o.type}</td><td>${o.date}</td><td><span class="status-badge status-completed">${o.status}</span></td></tr>`).join('')}</tbody></table>`;

            // Re-attach toggles
            document.getElementById('darkModeIconBtn')?.addEventListener('click', toggleDarkMode);
            document.getElementById('rtlIconBtn')?.addEventListener('click', toggleRTL);
        }

        function renderClasses() {
            document.getElementById('metrics-page').innerHTML = `
        <div class="top-header"><div class="page-title"><h1>My Health Metrics</h1><p>Track your ongoing health vitals</p></div><div class="header-actions"><button class="action-btn" style="width:auto;"><i class="fas fa-plus"></i> New Entry</button></div></div>
        <div class="products-grid" id="devicesGrid"></div>
      `;

            document.getElementById('devicesGrid').innerHTML = myEnrolledClasses.map(d => `
        <div class="product-card">

            <div style="font-size:0.85rem; margin-bottom: 1rem;"><strong>Action:</strong> <span style="color:#0284c7">${d.nextService}</span></div>
            <span class="status-badge status-completed">${d.status}</span>
          </div>
        </div>
      `).join('');
        }

        function renderHistory() {
            document.getElementById('appointments-page').innerHTML = `
        <div class="top-header"><div class="page-title"><h1>Appointments</h1><p>Your past visits and upcoming schedule</p></div><div class="header-actions"><button class="action-btn" style="width:auto;"><i class="fas fa-calendar-plus"></i> Book New</button></div></div>
        <div class="data-table"><table><thead><tr><th>Appt ID</th><th>Visit Type</th><th>Date</th><th>Billed</th><th>Status</th><th>Notes</th></tr></thead><tbody>${paymentHistory.map(s => `<tr><td>${s.id}</td><td>${s.type}</td><td>${s.date}</td><td>${s.amount}</td><td><span class="status-badge status-completed">${s.status}</span></td><td><button style="background:transparent; border:none; color:#0284c7; cursor:pointer;" title="Download Summary"><i class="fas fa-file-medical"></i></button></td></tr>`).join('')}</tbody></table></div>
      `;
        }

        function renderMerch() {
            document.getElementById('prescriptions-page').innerHTML = `
        <div class="top-header"><div class="page-title"><h1>My Prescriptions</h1><p>Manage your current medications and refills</p></div></div>
        <div class="chart-card" style="max-width: 600px;">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #eef2ff; padding-bottom: 1rem; margin-bottom: 1rem;">

              <h2 style="font-size: 1.4rem; font-weight: 700;">Levothyroxine (Synthroid)</h2>
              <p style="color:#166534; font-weight:600; font-size:0.9rem; margin-top:0.3rem;"><i class="fas fa-check-circle"></i> Active Rx</p>
            </div>
            <div style="text-align:right;">
              <span style="font-size:2rem; font-weight:700; color:#0284c7;">100</span><span style="font-size:0.8rem; color:#64748b;">mcg</span>
            </div>
          </div>
          <div style="margin-bottom: 1.5rem;">
            <p style="font-size:0.9rem; margin-bottom: 0.5rem;"><strong>Instructions:</strong> Take 1 tablet daily on an empty stomach.</p>
            <p style="font-size:0.9rem; margin-bottom: 0.5rem;"><strong>Refills Remaining:</strong> 2</p>
            <p style="font-size:0.9rem; margin-bottom: 0.5rem;"><strong>Prescribed by:</strong> Dr. Sarah Jenkins</p>
          </div>
          <button class="action-btn" style="width:100%;"><i class="fas fa-pills"></i> Request Refill</button>
        </div>
      `;
        }

        function renderSettings() {
            document.getElementById('settings-page').innerHTML = `
        <div class="top-header"><div class="page-title"><h1>Account Settings</h1><p>Update your personal and contact details</p></div></div>
        <div class="settings-form" style="max-width: 600px;">
          <h3 style="margin-bottom:1rem;">Patient Information</h3>
          <div class="form-group"><label>Full Name</label><input type="text" value="Emma Davis"></div>
          <div class="form-group"><label>Email Address</label><input type="email" value="emma@email.com"></div>
          <div class="form-group"><label>Primary Phone</label><input type="text" value="+1 (555) 987-6543"></div>
          <div class="form-group"><label>Home Address</label><input type="text" value="456 Health Way, Wellness City, ST 12345"></div>
          <div class="form-group"><label>Emergency Contact</label><input type="text" value="Michael Davis (Spouse) - 555-111-2222"></div>
          <button class="save-btn" onclick="alert('Profile updated successfully!')" style="margin-top: 1rem;">Save Changes</button>
        </div>
      `;
        }

        // Navigation
        document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => showPage(item.getAttribute('data-page'))));

        // Mobile sidebar controls
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        menuToggle?.addEventListener('click', () => sidebar.classList.contains('mobile-open') ? closeSidebar() : openSidebar());
        overlay?.addEventListener('click', closeSidebar);

        // Load saved preferences
        const savedTheme = localStorage.getItem('theme') || (localStorage.getItem('endoClinic_darkMode') === 'true' ? 'dark' : 'light');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark-mode');
        } else {
            document.documentElement.classList.remove('dark');
            document.body.classList.remove('dark-mode');
        }

        const savedDir = localStorage.getItem('direction') || (localStorage.getItem('endoClinic_rtl') === 'true' ? 'rtl' : 'ltr');
        if (savedDir === 'rtl') {
            document.documentElement.dir = 'rtl';
            document.body.classList.add('rtl-active');
        }

        // Initialize all pages
        renderDashboard();
        renderClasses();
        renderHistory();
        renderMerch();
        renderSettings();

        // Update Toggle Buttons UI
        updateThemeUI();
        updateRtlUI();

        // Global Event Delegation for theme & RTL toggles
        document.addEventListener('click', (e) => {
            if (e.target.closest('#darkModeIconBtn, #sidebarDarkModeBtn, .theme-toggle-btn')) {
                toggleDarkMode();
            }
            if (e.target.closest('#rtlIconBtn, #sidebarRtlBtn, .rtl-toggle-btn')) {
                toggleRTL();
            }
        });
    </script>
</body>

</html>
